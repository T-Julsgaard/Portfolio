<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Portrait — Interactive Prototype</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font-family:"SFMono-Regular", ui-monospace, "DejaVu Sans Mono", monospace; color:#fff; }
  #app { position:fixed; inset:0; }
  canvas#three { display:block; width:100%; height:100%; }

  .nav-label {
    position:fixed; z-index:4; transform:translate(-50%,-140%);
    padding:5px 10px; border:1px solid rgba(255,255,255,0.5);
    background:rgba(0,0,0,0.55); color:#fff; font-size:11px;
    letter-spacing:0.16em; text-transform:uppercase; white-space:nowrap;
    cursor:pointer; pointer-events:auto; opacity:0;
    transition:opacity 0.25s ease, background 0.2s ease, border-color 0.2s ease;
    backdrop-filter:blur(2px); text-shadow:0 0 8px rgba(255,255,255,0.5);
  }
  .nav-label::before { content:"\25B8 "; opacity:0.7; }
  .nav-label:hover { background:#fff; color:#000; border-color:#fff; }
  .nav-label.current { border-color:#fff; box-shadow:0 0 14px rgba(255,255,255,0.35); }

  #bottom-nav {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:5; display:flex; gap:4px; flex-wrap:wrap; justify-content:center;
    padding:6px; border:1px solid rgba(255,255,255,0.18); background:rgba(0,0,0,0.4);
    backdrop-filter:blur(3px);
  }
  .nav-link {
    background:transparent; border:none; color:rgba(255,255,255,0.65);
    font-family:inherit; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    padding:7px 12px; cursor:pointer; transition:color 0.2s ease, background 0.2s ease;
  }
  .nav-link:hover { color:#fff; }
  .nav-link.current { color:#000; background:#fff; }

  #panel {
    position:fixed; left:26px; top:50%; transform:translateY(-50%);
    z-index:5; max-width:320px; opacity:0; transition:opacity 0.5s ease;
  }
  #panel .eyebrow { font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:10px; }
  #panel .title { font-size:30px; font-weight:600; letter-spacing:0.04em; margin-bottom:14px; line-height:1.05; }
  #panel .body { font-size:13px; line-height:1.7; color:rgba(255,255,255,0.82); }
  #panel .index { margin-top:18px; font-size:10px; letter-spacing:0.2em; color:rgba(255,255,255,0.4); }

  #meta { position:fixed; left:18px; top:16px; z-index:5; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.45); }
  #hint { position:fixed; left:50%; bottom:78px; transform:translateX(-50%); z-index:5;
          font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.6);
          opacity:0; transition:opacity 0.6s ease; pointer-events:none; text-align:center; }
  #hint.show { opacity:1; }
  #hint .down { display:inline-block; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }

  #enter-btn {
    position:fixed; right:18px; top:14px; z-index:6;
    background:transparent; border:1px solid rgba(255,255,255,0.4); color:rgba(255,255,255,0.8);
    font-family:inherit; font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    padding:7px 12px; cursor:pointer;
  }
  #enter-btn:hover { background:#fff; color:#000; }

  #vignette { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.7) 100%); }
</style>

}}

/* bounds */
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity;
const allPts=[];
asciiData.groups.forEach(g=>g.instances.forEach(o=>{
  const z=o.z*10; allPts.push([o.x,o.y,z]);
  if(o.x<minX)minX=o.x; if(o.x>maxX)maxX=o.x;
  if(o.y<minY)minY=o.y; if(o.y>maxY)maxY=o.y;
  if(z<minZ)minZ=z; if(z>maxZ)maxZ=z;
}));
const centerX=(minX+maxX)/2, centerY=(minY+maxY)/2;
const spanX=maxX-minX, spanY=maxY-minY, midZ=(minZ+maxZ)/2;
const farDist=Math.max(spanX,spanY)*2.1;

/* renderer / scene / camera */
const canvas=document.getElementById('three');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#000000');
scene.fog=new THREE.Fog(0x000000, spanY*0.35, spanY*1.5);

const BASE_FOV=52;
const camera=new THREE.PerspectiveCamera(BASE_FOV, innerWidth/innerHeight, 0.1, 4000);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const BASE_BLOOM=0.7;
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),BASE_BLOOM,0.5,0.2);
composer.addPass(bloom);

/* glyphs */
const textMeshes=[];
new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json',font=>{
  asciiData.groups.forEach(group=>group.instances.forEach(inst=>{
    const geo=new TextGeometry(group.char,{font,size:1.0,height:0.02,curveSegments:2});
    geo.center(); geo.scale(0.6,1,1);
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:'#ffffff'}));
    m.position.set(inst.x,inst.y,inst.z*10);
    scene.add(m); textMeshes.push(m);
  }));
});

/* sections / anchors */
function pickAnchor(xf,yf){
  const tx=centerX+xf*spanX*0.5, ty=centerY+yf*spanY*0.5;
  let best=allPts[0],bs=Infinity;
  for(const p of allPts){ const dx=p[0]-tx,dy=p[1]-ty,s=dx*dx+dy*dy-p[2]*3.0; if(s<bs){bs=s;best=p;} }
  return new THREE.Vector3(best[0],best[1],best[2]);
}
const SECTIONS=[
  {id:'profile',label:'Profile',xf:0.0,yf:0.85,title:'Profile',body:'Creative developer working where code meets design. This portrait is built from 4,406 ASCII glyphs \u2014 each one a node you travel through. Placeholder copy; swap in your own.'},
  {id:'experience',label:'Experience',xf:-0.45,yf:0.32,title:'Experience',body:'Roles, projects, and things shipped. Drop your real timeline here.'},
  {id:'education',label:'Education',xf:0.45,yf:0.32,title:'Education',body:'Where you studied and what you studied. Degrees, courses, certifications.'},
  {id:'github',label:'GitHub',xf:0.0,yf:0.05,title:'GitHub',body:'Selected repositories and open-source work. Link out, or pull repos live via the API.'},
  {id:'blog',label:'Blog',xf:-0.28,yf:-0.36,title:'Blog',body:'Writing on design, code, and process. List your latest posts here.'},
  {id:'contact',label:'Contact',xf:0.0,yf:-0.82,title:'Contact',body:'Let us talk. you@example.com \u2014 the chin of the portrait; the journey ends here.'},
];
SECTIONS.forEach(s=> s.anchor=pickAnchor(s.xf,s.yf));
const order=SECTIONS.map((s,i)=>i).sort((a,b)=> SECTIONS[b].anchor.y - SECTIONS[a].anchor.y);
const N=order.length;

/* ---- DESCENT MODEL: travel straight down THROUGH the work, POV pointing down ---- */
const yTop=maxY+spanY*0.22;
const yBottom=minY-spanY*0.22;
const zAmp=(maxZ-minZ)*0.18;
function depthToY(d){ return yTop+(yBottom-yTop)*d; }
function descentPos(d, t){
  return new THREE.Vector3(
    centerX + Math.sin((t||0)*0.0007)*spanX*0.004,
    depthToY(d),
    midZ + Math.sin(d*Math.PI*2)*zAmp + Math.cos((t||0)*0.0006)*zAmp*0.15
  );
}
const sectionDepth={};
SECTIONS.forEach(s=>{ sectionDepth[s.id]=Math.min(1,Math.max(0,(yTop-s.anchor.y)/(yTop-yBottom))); });

/* starting depth: user explores freely from here, no forced intro flight */
const START_DEPTH=0.5;

/* UI build */
const labelEls={};
SECTIONS.forEach(s=>{
  const el=document.createElement('div'); el.className='nav-label'; el.textContent=s.label;
  el.addEventListener('click',()=>startWarp(s.id)); document.body.appendChild(el); labelEls[s.id]=el;
});
const bottomNav=document.getElementById('bottom-nav'); const linkEls={};
order.forEach(i=>{ const s=SECTIONS[i]; const b=document.createElement('button'); b.className='nav-link';
  b.textContent=s.label; b.addEventListener('click',()=>startWarp(s.id)); bottomNav.appendChild(b); linkEls[s.id]=b; });
const panel=document.getElementById('panel');
const pTitle=panel.querySelector('.title'), pBody=panel.querySelector('.body'), pIndex=panel.querySelector('.index');
const hint=document.getElementById('hint');
function showSection(id){
  const s=SECTIONS.find(x=>x.id===id); const idx=order.indexOf(SECTIONS.findIndex(x=>x.id===id));
  pTitle.textContent=s.title; pBody.textContent=s.body;
  pIndex.textContent=String(idx+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  panel.style.opacity=1;
  Object.values(linkEls).forEach(e=>e.classList.remove('current')); linkEls[id].classList.add('current');
  Object.values(labelEls).forEach(e=>e.classList.remove('current')); labelEls[id].classList.add('current');
}

/* state */
let depth=START_DEPTH, targetDepth=START_DEPTH;
let warping=false, warpFrom=0, warpTo=0, warpT0=0, warpDur=1.3, warpAmt=0, warpId=null, currentId=null;
function easeInOut(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

function startWarp(id){
  warpId=id; warpFrom=depth; warpTo=sectionDepth[id]; warping=true; warpT0=performance.now();
  warpDur=0.6+Math.abs(warpTo-warpFrom)*1.1; hint.classList.remove('show');
}
/* free exploration starts immediately on load; show the current section for the starting depth */
updateCurrentFromDepth();
hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),4500);
/* "Enter" always travels straight to Profile, no matter where the visitor currently is */
document.getElementById('enter-btn').addEventListener('click',()=>startWarp('profile'));

/* input */
function addScroll(dz){ if(warping)return;
  targetDepth=Math.min(1,Math.max(0,targetDepth+dz)); hint.classList.remove('show'); }
addEventListener('wheel',e=>addScroll(e.deltaY*0.0010),{passive:true});
let dragging=false,lastY=0;
addEventListener('pointerdown',e=>{dragging=true;lastY=e.clientY;});
addEventListener('pointermove',e=>{ if(dragging){addScroll((lastY-e.clientY)*0.0015);lastY=e.clientY;} });
addEventListener('pointerup',()=>dragging=false); addEventListener('pointercancel',()=>dragging=false);

/* nav label projection */
const _v=new THREE.Vector3();
function updateLabels(){
  for(const s of SECTIONS){
    const el=labelEls[s.id]; _v.copy(s.anchor).project(camera);
    const x=(_v.x*0.5+0.5)*innerWidth, y=(-_v.y*0.5+0.5)*innerHeight;
    const on=_v.z<1 && x>-60&&x<innerWidth+60&&y>-30&&y<innerHeight+30;
    if(on&&!warping){ el.style.left=x+'px'; el.style.top=y+'px';
      const d=camera.position.distanceTo(s.anchor); el.style.opacity=Math.max(0.3,Math.min(1,42/d)).toFixed(2);
    } else el.style.opacity=0;
  }
}
function updateCurrentFromDepth(){
  let bi=0,bd=Infinity;
  order.forEach((i,idx)=>{ const dd=Math.abs(depth-sectionDepth[SECTIONS[i].id]); if(dd<bd){bd=dd;bi=i;} });
  const id=SECTIONS[bi].id; if(id!==currentId){ currentId=id; showSection(id); }
}

/* loop */
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=clock.getDelta(), now=performance.now();

  if(warping){
    let k=(now-warpT0)/(warpDur*1000);
    if(k>=1){k=1;warping=false;depth=warpTo;targetDepth=warpTo;currentId=warpId;showSection(warpId);}
    depth=warpFrom+(warpTo-warpFrom)*easeInOut(Math.min(1,k));
    targetDepth=depth; warpAmt=Math.sin(Math.PI*Math.min(1,k));
  } else {
    depth+=(targetDepth-depth)*Math.min(1,dt*5);
    warpAmt+=(0-warpAmt)*Math.min(1,dt*5);
    updateCurrentFromDepth();
  }
  const p=descentPos(Math.min(1,Math.max(0,depth)),now);
  camera.up.set(0,0,1);
  camera.position.copy(p);
  camera.lookAt(p.x,p.y-1,p.z);
  camera.fov=BASE_FOV+warpAmt*6; camera.updateProjectionMatrix();
  updateLabels();

  for(let i=0;i<textMeshes.length;i++) textMeshes[i].quaternion.copy(camera.quaternion);
  composer.render();
}
frame();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});
